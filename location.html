<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>駕駛員位置｜平安家園</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#f0f4f8;--card:#fff;--border:#d0dce8;
  --accent:#2563eb;--accent2:#0ea579;--accent3:#d97706;
  --danger:#dc2626;--text:#1e293b;--muted:#64748b;--muted2:#94a3b8;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,0.06);flex-shrink:0;}
.org-logo{width:34px;height:34px;border-radius:8px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;}
.org-name{font-size:13px;font-weight:600;color:var(--text);}
.org-sub{font-size:11px;color:var(--muted);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.clock{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:600;color:var(--accent);}
.main{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto;width:100%;}
.status-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,0.05);}
.status-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.status-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text);}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite;flex-shrink:0;}
.live-dot.off{background:var(--muted2);animation:none;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(14,165,121,.4);}50%{box-shadow:0 0 0 6px rgba(14,165,121,0);}}
.status-updated{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.info-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.info-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.info-label{font-size:10px;color:var(--muted);margin-bottom:3px;font-weight:500;}
.info-value{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--text);}
.info-value.green{color:var(--accent2);}
.info-value.blue{color:var(--accent);}
.info-value.orange{color:var(--accent3);}
.info-value.red{color:var(--danger);animation:blink 1s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.35;}}
.speed-banner{background:#fef2f2;border:1.5px solid #fecaca;border-radius:8px;padding:10px 14px;color:var(--danger);font-size:13px;font-weight:700;text-align:center;display:none;animation:blink 1s ease-in-out infinite;margin-bottom:8px;}
.signal-lost-banner{background:#fef3c7;border:1.5px solid #fcd34d;border-radius:8px;padding:10px 14px;color:#b45309;font-size:13px;font-weight:600;text-align:center;display:none;animation:blink 1.2s ease-in-out infinite;margin-bottom:8px;}
.driver-info{display:flex;align-items:center;gap:10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:10px 14px;margin-bottom:10px;}
.driver-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;}
.driver-name{font-size:14px;font-weight:700;color:var(--text);}
.driver-purpose{font-size:12px;color:var(--muted);margin-top:2px;}
.no-signal{text-align:center;padding:28px 16px;color:var(--muted);font-size:14px;line-height:1.8;}
.no-signal-icon{font-size:40px;margin-bottom:8px;}
.map-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.05);flex:1;min-height:340px;}
#driver-map{height:100%;min-height:340px;width:100%;}
.limit-row{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);}
.limit-row select,.limit-row input{font-size:11px;padding:3px 6px;border:1px solid var(--border);border-radius:5px;background:#fff;color:var(--text);font-family:'Noto Sans TC',sans-serif;}
</style>
</head>
<body>

<div class="topbar">
  <div class="org-logo">平</div>
  <div>
    <div class="org-name">嘉義縣平安家園多元關懷協會</div>
    <div class="org-sub">駕駛員即時位置</div>
  </div>
  <div class="topbar-right">
    <div class="limit-row">
      <span>道路</span>
      <select id="road-type">
        <option value="60">一般（60）</option>
        <option value="100">快速（100）</option>
        <option value="110">高速（110）</option>
        <option value="custom">自訂…</option>
      </select>
      <input type="number" id="custom-limit" value="60" min="0" step="5" style="display:none;width:48px;text-align:center;">
      <span>km/h</span>
    </div>
    <div class="clock" id="clock">--:--</div>
  </div>
</div>

<div class="main">
  <div class="status-card">
    <div class="status-header">
      <div class="status-title">
        <div class="live-dot off" id="live-dot"></div>
        <span id="status-title-text">等待駕駛員開始回報</span>
      </div>
      <div class="status-updated" id="status-updated">—</div>
    </div>
    <div id="no-signal-area">
      <div class="no-signal">
        <div class="no-signal-icon">📡</div>
        駕駛員尚未開始回報位置<br>
        <span style="font-size:12px;">請駕駛員開啟回報頁面並點「開始回報位置」</span>
      </div>
    </div>
    <div id="signal-area" style="display:none;">
      <div class="driver-info">
        <div class="driver-avatar" id="driver-avatar">—</div>
        <div>
          <div class="driver-name" id="driver-name">—</div>
          <div class="driver-purpose" id="driver-purpose">—</div>
        </div>
      </div>
      <div class="speed-banner" id="speed-banner">🚨 超速警示！駕駛員速度超出限制，請注意安全</div>
      <div class="signal-lost-banner" id="signal-lost-banner">⚠️ 駕駛員手機進行多工，訊號暫時中斷</div>
      <div class="info-row">
        <div class="info-box">
          <div class="info-label">當前速度</div>
          <div class="info-value" id="disp-speed">—</div>
        </div>
        <div class="info-box">
          <div class="info-label">定位精確度</div>
          <div class="info-value blue" id="disp-accuracy">—</div>
        </div>
        <div class="info-box">
          <div class="info-label">訊號強度</div>
          <div class="info-value" id="disp-signal">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="map-card">
    <div id="driver-map"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBxz9NGnpnF6lzy5TcRGWFOrDYFIVkGpjw",
  authDomain: "vehicle-b4ae5.firebaseapp.com",
  projectId: "vehicle-b4ae5",
  storageBucket: "vehicle-b4ae5.firebasestorage.app",
  messagingSenderId: "623928657886",
  appId: "1:623928657886:web:c09ccbb9cfd30c9b0b3f4f",
  databaseURL: "https://vehicle-b4ae5-default-rtdb.asia-southeast1.firebasedatabase.app"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const locationRef = ref(db, 'vehicle_location');

function pad(n){ return String(n).padStart(2,'0'); }
setInterval(()=>{
  const now=new Date();
  document.getElementById('clock').textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}`;
},1000);

let map=null, marker=null;
function initMap(){
  if(map) return;
  map=L.map('driver-map').setView([23.4518,120.2554],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
}
initMap();

document.getElementById('road-type').addEventListener('change',function(){
  document.getElementById('custom-limit').style.display=this.value==='custom'?'inline-block':'none';
  if(lastLoc) applyLoc(lastLoc);
});
document.getElementById('custom-limit').addEventListener('input',()=>{ if(lastLoc) applyLoc(lastLoc); });

function getSpeedLimit(){
  const rt=document.getElementById('road-type').value;
  if(rt==='custom') return parseFloat(document.getElementById('custom-limit').value)||60;
  return parseFloat(rt)||60;
}

let lastLocTs=null, lastLoc=null;
setInterval(()=>{
  if(!lastLocTs) return;
  if(Date.now()-lastLocTs > 120000){
    document.getElementById('signal-lost-banner').style.display='block';
    document.getElementById('live-dot').className='live-dot off';
  }
},1000);

function applyLoc(loc){
  const limit=getSpeedLimit();
  const speed=loc.speed;
  const isSpeeding=speed!==null&&speed!==undefined&&speed>limit;
  const name=loc.driver||'—';

  document.getElementById('driver-name').textContent=name;
  document.getElementById('driver-purpose').textContent=loc.purpose||'—';
  document.getElementById('driver-avatar').textContent=name.charAt(0)||'—';

  const speedEl=document.getElementById('disp-speed');
  if(speed!==null&&speed!==undefined){
    speedEl.textContent=`${speed} km/h`;
    speedEl.className='info-value '+(isSpeeding?'red':speed>3?'green':'orange');
  } else {
    speedEl.textContent='— km/h';
    speedEl.className='info-value';
  }
  document.getElementById('speed-banner').style.display=isSpeeding?'block':'none';

  const acc=loc.accuracy;
  const accEl=document.getElementById('disp-accuracy');
  accEl.textContent=acc?`±${acc} m`:'—';
  accEl.className='info-value '+(acc<30?'green':acc<100?'blue':'orange');

  const sigEl=document.getElementById('disp-signal');
  if(!acc){sigEl.textContent='—';sigEl.className='info-value';}
  else if(acc<20){sigEl.textContent='優良 ▊▊▊';sigEl.className='info-value green';}
  else if(acc<50){sigEl.textContent='良好 ▊▊▁';sigEl.className='info-value blue';}
  else if(acc<100){sigEl.textContent='普通 ▊▁▁';sigEl.className='info-value orange';}
  else{sigEl.textContent='弱 ▁▁▁';sigEl.className='info-value red';}

  const now=new Date();
  document.getElementById('status-updated').textContent=`更新 ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

  const latlng=[loc.lat,loc.lng];
  const dotHtml=isSpeeding
    ?'<div style="width:20px;height:20px;border-radius:50%;background:#dc2626;border:3px solid #fff;box-shadow:0 0 0 5px rgba(220,38,38,0.4);"></div>'
    :'<div style="width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 4px rgba(37,99,235,0.25);"></div>';
  if(marker){
    marker.setLatLng(latlng);
    marker.setIcon(L.divIcon({className:'',html:dotHtml,iconSize:[20,20],iconAnchor:[10,10]}));
  } else {
    marker=L.marker(latlng,{icon:L.divIcon({className:'',html:dotHtml,iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map);
  }
  const speedTxt=speed!==null?`${speed} km/h${isSpeeding?' ⚠️超速':''}`:'速度未知';
  marker.bindPopup(`<b>${name}</b><br>${loc.purpose||''}<br>速度：${speedTxt}`);
  map.setView(latlng,map.getZoom()<14?16:map.getZoom());
  setTimeout(()=>map.invalidateSize(),50);
}

onValue(locationRef,(snapshot)=>{
  const dot=document.getElementById('live-dot');
  const noSignal=document.getElementById('no-signal-area');
  const signalArea=document.getElementById('signal-area');
  const lostBanner=document.getElementById('signal-lost-banner');
  const titleText=document.getElementById('status-title-text');

  if(!snapshot.exists()||!snapshot.val().active){
    lastLoc=null; lastLocTs=null;
    dot.className='live-dot off';
    noSignal.style.display='block';
    signalArea.style.display='none';
    lostBanner.style.display='none';
    titleText.textContent=snapshot.exists()&&!snapshot.val().active
      ?`追蹤已停止（${snapshot.val().driver||''}）`
      :'等待駕駛員開始回報';
    document.getElementById('status-updated').textContent='—';
    return;
  }
  const loc=snapshot.val();
  lastLoc=loc; lastLocTs=loc.ts;
  dot.className='live-dot';
  noSignal.style.display='none';
  signalArea.style.display='block';
  lostBanner.style.display='none';
  titleText.textContent=`${loc.driver||'駕駛員'} 位置回報中`;
  applyLoc(loc);
});
</script>
</body>
</html>
